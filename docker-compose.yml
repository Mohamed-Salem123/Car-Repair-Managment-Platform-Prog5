version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: garage-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - garage-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: garage-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - garage-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Identity Service
  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: identity-service
    ports:
      - "8001:8001"
    environment:
      NODE_ENV: production
      PORT: 8001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/identity_db
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - garage-network
    restart: unless-stopped

  # Repair Order Service
  repair-service:
    build:
      context: ./services/repair-service
      dockerfile: Dockerfile
    container_name: repair-service
    ports:
      - "8002:8002"
    environment:
      NODE_ENV: production
      PORT: 8002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/repair_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      PAYMENT_SERVICE_URL: http://payment-service:8003
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - garage-network
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8003:8003"
    environment:
      NODE_ENV: production
      PORT: 8003
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payment_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - garage-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8004:8004"
    environment:
      NODE_ENV: production
      PORT: 8004
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notification_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - garage-network
    restart: unless-stopped

  # AI Assistant Service
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    ports:
      - "8005:8005"
    environment:
      NODE_ENV: production
      PORT: 8005
      AI_PROVIDER: groq
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: llama-3.1-70b-versatile
      REPAIR_SERVICE_URL: http://repair-service:8002
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
    depends_on:
      - repair-service
    networks:
      - garage-network
    restart: unless-stopped

  # API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      IDENTITY_SERVICE_URL: http://identity-service:8001
      REPAIR_SERVICE_URL: http://repair-service:8002
      PAYMENT_SERVICE_URL: http://payment-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      AI_SERVICE_URL: http://ai-service:8005
    depends_on:
      - identity-service
      - repair-service
      - payment-service
      - notification-service
      - ai-service
    networks:
      - garage-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - gateway
    networks:
      - garage-network
    restart: unless-stopped

networks:
  garage-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
